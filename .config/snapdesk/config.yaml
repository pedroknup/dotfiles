windowPreview:
  enabled: true
  maxWidth: 4e+2
  maxHeight: 2.95e+2
  cacheTimeoutSeconds: 5e+0
theme:
  accentColorRed: 7e-3
  accentColorGreen: 4.78e-1
  accentColorBlue: 1e+0
  accentColorAlpha: 1e+0
  activeWindowBorderWidth: 2e+0
  inactiveWindowOpacity: 8.5e-1
windowBehavior:
  margins:
    enabled: false
    smart: false
    size: 0e+0
  minimumSize:
    width: 2e+2
    height: 1.5e+2
  screenPadding:
    left: 0e+0
    right: 0e+0
    top: 0e+0
    bottom: 0e+0
    disableOnBuiltinDisplay: false
  ignoreMenuBar: false
  floatSmallWindows: true
  mouseFollowsFocus: false
application:
  launchAtLogin: true
  showAllLayoutsOnToggle: true
